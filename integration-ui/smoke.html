<!doctype html><html lang="en"><meta charset="utf-8"><title>Integration UI smoke test</title>
<iframe id="app" src="/" title="TapKey test UI"></iframe><p id="result">pending</p>
<script type="module">
  const frame = document.querySelector('#app');
  const result = document.querySelector('#result');
  const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
  try {
    await new Promise((resolve) => frame.addEventListener('load', resolve, { once: true }));
    const doc = frame.contentDocument;
    for (let i = 0; i < 20 && !doc.querySelector('[aria-live]'); i++) await wait(50);
    if (!doc.querySelector('[aria-live]')) throw new Error('Accessibility module did not initialize');
    const user = `smoke_${Date.now()}`;
    doc.querySelector('#username').value = user;
    doc.querySelector('#start').click();
    await wait(150);
    if (!doc.querySelector('#status').textContent.includes('Username received')) throw new Error('Identity response was not announced');
    const area = doc.querySelector('#capture');
    for (let group = 0; group < 4; group++) {
      area.dispatchEvent(new frame.contentWindow.KeyboardEvent('keydown', { key: ' ', code: 'Space', bubbles: true, cancelable: true }));
      area.dispatchEvent(new frame.contentWindow.KeyboardEvent('keydown', { key: 'Enter', code: 'Enter', bubbles: true, cancelable: true }));
    }
    if (!doc.querySelector('#status').textContent.includes('recorded')) throw new Error('Tap pattern was not captured');
    doc.querySelector('#enroll').click();
    await wait(400);
    if (!doc.querySelector('#status').textContent.includes('enrolled')) throw new Error('Factor 2 enrollment failed');
    doc.querySelector('#verify').click();
    await wait(400);
    if (!doc.querySelector('#status').textContent.includes('accepted')) throw new Error('Factor 2 verification failed');
    result.textContent = 'PASS: UI, ARIA, keyboard capture, Factor 2, partial session';
  } catch (error) { result.textContent = 'FAIL: ' + error.message; }
</script></html>
