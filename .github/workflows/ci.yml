name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  factor1-webauthn:
    name: Factor 1 WebAuthn Tests & Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'factor1-webauthn/package-lock.json'
      - name: Install dependencies
        working-directory: ./factor1-webauthn
        run: npm ci
      - name: Build TypeScript
        working-directory: ./factor1-webauthn
        run: npm run build
      - name: Run Test Suite
        working-directory: ./factor1-webauthn
        run: npm test

  factor2-spacebar:
    name: Factor 2 Spacebar Tests & Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'factor2-spacebar/package-lock.json'
      - name: Install dependencies
        working-directory: ./factor2-spacebar
        run: npm ci
      - name: Build TypeScript
        working-directory: ./factor2-spacebar
        run: npm run build
      - name: Run Test Suite
        working-directory: ./factor2-spacebar
        run: npm test

  accessibility-engine:
    name: Accessibility Engine Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run Unit Tests
        working-directory: ./accessibility-engine
        run: npm test

  server:
    name: Server Orchestration & Session Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: ./server
        run: npm install
      - name: Build TypeScript
        working-directory: ./server
        run: npm run build
      - name: Run Test Suite
        working-directory: ./server
        run: npm test

  security:
    name: Security Hardening & Rate Limiter Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'security/package-lock.json'
      - name: Install dependencies
        working-directory: ./security
        run: npm ci
      - name: Run Test Suite
        working-directory: ./security
        run: npm test
