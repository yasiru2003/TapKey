<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Local development demo for the TapKey Factor 2 four-digit spacebar PIN." />
    <title>Factor 2 - Four-Digit Spacebar PIN Demo</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="shell">
      <header class="masthead">
        <p class="eyebrow">TapKey / development surface</p>
        <h1>Factor 2 — Four-Digit Spacebar PIN</h1>
        <p class="intro">Click here to activate tactile PIN input.</p>
      </header>

      <section class="workspace" aria-labelledby="workspace-title">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Factor 2</p>
            <h2 id="workspace-title">Tactile PIN input</h2>
          </div>
          <span class="dev-badge">LOCAL ONLY</span>
        </div>

        <button id="capture-area" class="capture-area" type="button" aria-label="Activate spacebar PIN input">
          <span class="capture-kicker">Capture area</span>
          <strong>Click here to activate tactile PIN input</strong>
          <span>Space = tap</span>
          <span>Enter = confirm current digit</span>
          <span>Escape = restart PIN</span>
          <span id="focus-state" class="focus-state">Ready when you are</span>
        </button>

        <div class="progress-row" aria-label="PIN progress">
          <span id="progress">Digit 1 of 4</span>
          <button id="reset-button" class="text-button" type="button">Reset</button>
        </div>

        <div class="actions">
          <button id="enroll-button" class="primary-button" type="button" disabled>Enroll Current PIN</button>
          <button id="verify-button" class="secondary-button" type="button" disabled>Verify Current PIN</button>
        </div>

        <div id="status" class="status" role="status" aria-live="polite">Enter first digit.</div>
        <p class="boundary-note">Factor 2 passed. The complete system must now create a PartialAuthSession and proceed to Factor 1/WebAuthn.</p>
      </section>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
